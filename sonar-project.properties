# SonarCloud analysis, run by the sonarcloud job in .github/workflows/ci.yml
sonar.organization=manuelgaetani
sonar.projectKey=manuelgaetani_Team7_SE2_2026_MountainHut
sonar.projectName=Team7_SE2_2026_MountainHut

sonar.sourceEncoding=UTF-8
sonar.sources=apps/api/src,apps/web/src,packages/shared/src
sonar.tests=apps/api/src,apps/api/test,apps/web/src,packages/shared/src,e2e/tests,e2e/fixtures
# Unit tests live next to the code, so they are split out of sources by pattern
sonar.test.inclusions=**/*.spec.ts,**/*.e2e-spec.ts,**/*.test.ts,**/*.test.tsx,e2e/**
sonar.exclusions=**/*.spec.ts,**/*.test.ts,**/*.test.tsx,**/generated/**,**/dist/**,**/coverage/**,**/node_modules/**

# Entry points and test setup are not covered by unit tests
sonar.coverage.exclusions=apps/api/src/main.ts,apps/web/src/main.tsx,apps/web/src/test/**

# lcov paths are rewritten to be repo-relative before the scan
sonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info,apps/web/coverage/lcov.info,packages/shared/coverage/lcov.info
