name: CI

on:
  push:
    branches: [master, validation]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a running deploy on master
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format docs
        run: npx prettier --write README.md Retrospective-Template-v4.md

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      # Conflict markers, focused tests (.only), skipped tests without a TODO(<ticket>)
      - name: Hygiene
        run: npm run hygiene

      # Generated Prisma client and shared dist are required by typecheck/tests
      - name: Generate Prisma client
        run: npm run prisma:generate -w @mountain-hut/api

      - name: Build shared package
        run: npm run build -w @mountain-hut/shared

      - name: Typecheck
        run: npm run typecheck

      # Unused files, exports and dependencies
      - name: Dead code
        run: npm run knip

      # Circular imports, undeclared dependencies, boundaries between apps and packages
      - name: Architecture rules
        run: npm run depcruise

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: check
    # Required by docker compose; only used by the throwaway e2e stack
    env:
      JWT_SECRET: e2e-only-not-a-real-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npm run install-browsers -w @mountain-hut/e2e

      - name: Start system
        run: docker compose up --build -d --wait

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

      - name: Stop system
        if: always()
        run: docker compose down -v

  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: check
    # Secrets are not exposed to pull requests from forks
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history for blame data and new-code detection
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate -w @mountain-hut/api

      - name: Build shared package
        run: npm run build -w @mountain-hut/shared

      - name: Test with coverage
        run: npm run test:cov

      # vitest writes lcov paths relative to each workspace; Sonar resolves them from the repo root
      - name: Make coverage paths repo-relative
        run: |
          for ws in apps/api apps/web packages/shared; do
            sed -i "s#^SF:#SF:$ws/#" "$ws/coverage/lcov.info"
          done

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  cd:
    name: CD
    needs: [check, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/cd.yml
