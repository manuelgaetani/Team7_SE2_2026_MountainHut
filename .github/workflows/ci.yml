name: CI

on:
  push:
    branches: [master, validation]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a running deploy on master
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format docs
        run: npx prettier --write README.md Retrospective-Template-v4.md

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      # Generated Prisma client and shared dist are required by typecheck/tests
      - name: Generate Prisma client
        run: npm run prisma:generate -w @mountain-hut/api

      - name: Build shared package
        run: npm run build -w @mountain-hut/shared

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: check
    # Required by docker compose; only used by the throwaway e2e stack
    env:
      JWT_SECRET: e2e-only-not-a-real-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npm run install-browsers -w @mountain-hut/e2e

      - name: Start system
        run: docker compose up --build -d --wait

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop system
        if: always()
        run: docker compose down -v

  cd:
    name: CD
    needs: [check, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/cd.yml
