name: CD

# Triggered by ci.yml after all checks pass on master, or manually
on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build, publish and run Docker image
    runs-on: ubuntu-latest
    # Manual dispatch from other branches must not publish images
    if: github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4

      # GHCR image names must be lowercase
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only the commit tag is pushed here; latest is promoted after the health check
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Run the published image with the compose stack and wait for its healthcheck
      - name: Run container
        run: |
          docker pull "$IMAGE:${{ github.sha }}"
          docker tag "$IMAGE:${{ github.sha }}" mountain-hut:local
          docker compose up -d --no-build --wait

      - name: Health check
        run: curl --fail --retry 5 --retry-delay 3 http://localhost:3000/api/health

      - name: Promote image to latest
        run: docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE:${{ github.sha }}"

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop container
        if: always()
        run: docker compose down -v
