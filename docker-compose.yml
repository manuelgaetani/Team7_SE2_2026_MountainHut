services:
  app:
    build: .
    image: mountain-hut:local
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-mountainhut}:${POSTGRES_PASSWORD:-mountainhut}@db:5432/${POSTGRES_DB:-mountainhut}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set, see .env.example}
      BOOKING_TIMEZONE: ${BOOKING_TIMEZONE:-Europe/Rome}
      # Emails go to Mailpit unless a real SMTP server is configured.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-Mountain Hut <no-reply@mountain-hut.test>}
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mountainhut}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mountainhut}
      POSTGRES_DB: ${POSTGRES_DB:-mountainhut}
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  # Fake SMTP server: catches every email instead of delivering it.
  # Read the emails at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.32
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  db-data:
